name: Build Arch package

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Check out packaging files
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
            git ca-certificates gnupg \
            gtk3 libnotify nss libxss libxtst xdg-utils at-spi2-core \
            util-linux-libs libsecret
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        shell: bash
        run: |
          runuser -u builder -- makepkg --syncdeps --noconfirm --cleanbuild --clean

      - name: Sign package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ZCODE_GPG_PRIVATE_KEY: ${{ secrets.ZCODE_GPG_PRIVATE_KEY }}
        run: |
          test -n "$ZCODE_GPG_PRIVATE_KEY"
          printf '%s\n' "$ZCODE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes \
            --local-user D6B0BCF696FB823671E891B01F59A4AF744CBD92 \
            --detach-sign ./*.pkg.tar.zst


      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-x86_64-package
          path: |
            *.pkg.tar.zst
            *.pkg.tar.zst.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: zcode-x86_64-package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.pkg.tar.zst ./*.pkg.tar.zst.sig zcode-maintainer-public.asc --generate-notes --verify-tag
