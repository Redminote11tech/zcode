name: Update AUR package

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

concurrency:
  group: aur-package-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AUR SSH access
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H aur.archlinux.org >> "$HOME/.ssh/known_hosts"

      - name: Check out AUR package
        shell: bash
        run: git clone --branch master ssh://aur@aur.archlinux.org/zcode-redminote11tech.git "$RUNNER_TEMP/aur"

      - name: Find and apply latest ZCode release
        id: release
        shell: bash
        run: |
          cd "$RUNNER_TEMP/aur"
          python - <<'PY'
          import hashlib
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          pkgbuild = Path('PKGBUILD')
          text = pkgbuild.read_text()
          current = re.search(r'^pkgver=([^\n]+)$', text, re.MULTILINE).group(1)
          current_x64 = re.search(r"^sha256sums_x86_64=\('([^']+)'\)$", text, re.MULTILINE).group(1)
          current_arm = re.search(r"^sha256sums_aarch64=\('([^']+)'\)$", text, re.MULTILINE).group(1)

          def version_key(version):
              return tuple(int(part) for part in version.split('.'))

          releases = set()
          releases.add(current)
          page_url = f'https://zcode.z.ai/en?zcode_update={int(time.time())}'
          page = urllib.request.urlopen(page_url, timeout=30).read().decode('utf-8', 'replace')
          pattern = re.compile(r'/zcode/electron/releases/(?P<version>[0-9]+\.[0-9]+\.[0-9]+)/linux-x64/ZCode-[^"\'<> ]+-linux-x64\.deb')
          releases.update(match.group('version') for match in pattern.finditer(page))

          major, minor, patch = version_key(current)
          for minor_offset in range(4):
              candidate_minor = minor + minor_offset
              first_patch = patch + 1 if minor_offset == 0 else 0
              for candidate_patch in range(first_patch, first_patch + 20):
                  releases.add(f'{major}.{candidate_minor}.{candidate_patch}')

          def url_for(version, arch):
              deb_arch = 'x64' if arch == 'x86_64' else 'arm64'
              return f'https://cdn-zcode.z.ai/zcode/electron/releases/{version}/linux-{deb_arch}/ZCode-{version}-linux-{deb_arch}.deb'

          available = set()
          for version in releases:
              try:
                  urllib.request.urlopen(urllib.request.Request(url_for(version, 'x86_64'), method='HEAD'), timeout=10).close()
                  urllib.request.urlopen(urllib.request.Request(url_for(version, 'aarch64'), method='HEAD'), timeout=10).close()
              except (urllib.error.HTTPError, urllib.error.URLError):
                  continue
              available.add(version)

          if not available:
              raise SystemExit('No complete x86_64/aarch64 ZCode release found')
          version = max(available, key=version_key)

          def digest(url):
              result = hashlib.sha256()
              with urllib.request.urlopen(url, timeout=120) as response:
                  while chunk := response.read(1024 * 1024):
                      result.update(chunk)
              return result.hexdigest()

          x64_hash = digest(url_for(version, 'x86_64'))
          arm_hash = digest(url_for(version, 'aarch64'))
          if version_key(version) < version_key(current) or (version == current and x64_hash == current_x64 and arm_hash == current_arm):
              print(f'Current AUR release {current} is up to date')
              raise SystemExit(0)

          pkgrel = 1
          text = re.sub(r'^pkgver=[^\n]+$', f'pkgver={version}', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^pkgrel=[^\n]+$', f'pkgrel={pkgrel}', text, count=1, flags=re.MULTILINE)
          text = re.sub(r"^sha256sums_x86_64=\('[^']+'\)$", f"sha256sums_x86_64=('{x64_hash}')", text, count=1, flags=re.MULTILINE)
          text = re.sub(r"^sha256sums_aarch64=\('[^']+'\)$", f"sha256sums_aarch64=('{arm_hash}')", text, count=1, flags=re.MULTILINE)
          pkgbuild.write_text(text)

          srcinfo = Path('.SRCINFO')
          srcinfo_text = srcinfo.read_text()
          srcinfo_text = re.sub(r'^\tpkgver = [^\n]+$', f'\tpkgver = {version}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^\tpkgrel = [^\n]+$', f'\tpkgrel = {pkgrel}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^\tprovides = zcode=[^\n]+$', f'\tprovides = zcode={version}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^\t(source|noextract) = ZCode-[^\n]+$', lambda match: f'\t{match.group(1)} = ZCode-{version}-linux-{"x64" if "x64" in match.group(0) else "arm64"}.deb' if match.group(1) == 'noextract' else match.group(0), srcinfo_text, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^\tsource_x86_64 = [^\n]+$', f'\tsource_x86_64 = ZCode-{version}-linux-x64.deb::https://cdn-zcode.z.ai/zcode/electron/releases/{version}/linux-x64/ZCode-{version}-linux-x64.deb', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^\tsource_aarch64 = [^\n]+$', f'\tsource_aarch64 = ZCode-{version}-linux-arm64.deb::https://cdn-zcode.z.ai/zcode/electron/releases/{version}/linux-arm64/ZCode-{version}-linux-arm64.deb', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^\tsha256sums_x86_64 = [^\n]+$', f'\tsha256sums_x86_64 = {x64_hash}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^\tsha256sums_aarch64 = [^\n]+$', f'\tsha256sums_aarch64 = {arm_hash}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo.write_text(srcinfo_text)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'updated=true\nversion={version}\n')
          print(f'Updated AUR package to {version}-1')
          PY

      - name: Commit and push AUR update
        if: steps.release.outputs.updated == 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP/aur"
          git config user.name 'Redminote11tech'
          git config user.email 'redminote11tech@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ steps.release.outputs.version }}"
          git push origin master
