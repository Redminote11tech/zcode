name: Update ZCode

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging files
        uses: actions/checkout@v4

      - name: Find and verify the latest Linux release
        id: release
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          page_url = f'https://zcode.z.ai/en?zcode_update={int(time.time())}'
          page = urllib.request.urlopen(page_url, timeout=30).read().decode('utf-8', 'replace')
          pattern = re.compile(
              r'(?:https://cdn-zcode\.z\.ai)?/zcode/electron/releases/'
              r'(?P<version>[0-9]+\.[0-9]+\.[0-9]+)/linux-x64/'
              r'(?P<name>ZCode-[^"\'<> ]+-linux-x64\.deb)'
          )
          releases = {
              (match.group('version'), match.group('name'))
              for match in pattern.finditer(page)
              if match.group('name') == f"ZCode-{match.group('version')}-linux-x64.deb"
          }

          pkgbuild = Path('PKGBUILD')
          text = pkgbuild.read_text()
          current_match = re.search(r'^pkgver=([^\n]+)$', text, re.MULTILINE)
          current_hash_match = re.search(r"^sha256sums=\('([^']+)'\)$", text, re.MULTILINE)
          current_rel_match = re.search(r'^pkgrel=([0-9]+)$', text, re.MULTILINE)
          current = current_match.group(1)
          current_hash = current_hash_match.group(1)
          current_rel = int(current_rel_match.group(1))

          def version_key(item):
              return tuple(int(part) for part in item[0].split('.'))

          current_key = version_key((current, ''))
          major, minor, patch = current_key
          for minor_offset in range(4):
              candidate_minor = minor + minor_offset
              first_patch = patch + 1 if minor_offset == 0 else 0
              for candidate_patch in range(first_patch, first_patch + 20):
                  candidate = f'{major}.{candidate_minor}.{candidate_patch}'
                  candidate_name = f'ZCode-{candidate}-linux-x64.deb'
                  candidate_url = f'https://cdn-zcode.z.ai/zcode/electron/releases/{candidate}/linux-x64/{candidate_name}'
                  try:
                      urllib.request.urlopen(urllib.request.Request(candidate_url, method='HEAD'), timeout=10).close()
                  except (urllib.error.HTTPError, urllib.error.URLError):
                      continue
                  releases.add((candidate, candidate_name))

          if not releases:
              raise SystemExit('No Linux x86_64 ZCode download found on the official website or CDN')

          version, name = max(releases, key=version_key)
          url = f'https://cdn-zcode.z.ai/zcode/electron/releases/{version}/linux-x64/{name}'
          digest = hashlib.sha256()
          with urllib.request.urlopen(url, timeout=60) as response:
              while chunk := response.read(1024 * 1024):
                  digest.update(chunk)

          release_key = version_key((version, name))
          if release_key < current_key or (release_key == current_key and digest.hexdigest() == current_hash):
              print(f'Current release {current} is up to date')
              raise SystemExit(0)

          if release_key == current_key:
              new_rel = current_rel + 1
          else:
              new_rel = 1
          text = re.sub(r'^pkgver=[^\n]+$', f'pkgver={version}', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^pkgrel=[^\n]+$', f'pkgrel={new_rel}', text, count=1, flags=re.MULTILINE)
          text = re.sub(r"^sha256sums=\('[^']+'\)$", f"sha256sums=('{digest.hexdigest()}')", text, count=1, flags=re.MULTILINE)
          pkgbuild.write_text(text)
          srcinfo = Path('.SRCINFO')
          srcinfo_text = srcinfo.read_text()
          srcinfo_text = re.sub(r'^pkgver = [^\n]+$', f'pkgver = {version}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^pkgrel = [^\n]+$', f'pkgrel = {new_rel}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^source = [^\n]+$', f'source = ZCode-{version}-linux-x64.deb::https://cdn-zcode.z.ai/zcode/electron/releases/{version}/linux-x64/ZCode-{version}-linux-x64.deb', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo_text = re.sub(r'^sha256sums = [^\n]+$', f'sha256sums = {digest.hexdigest()}', srcinfo_text, count=1, flags=re.MULTILINE)
          srcinfo.write_text(srcinfo_text)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'updated=true\nversion={version}\nurl={url}\n')
          print(f'Updated ZCode to {version}-{new_rel}: {url}')
          PY

      - name: Open update pull request
        if: steps.release.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/zcode-update
          delete-branch: true
          commit-message: 'chore: update ZCode to ${{ steps.release.outputs.version }}'
          title: 'chore: update ZCode to ${{ steps.release.outputs.version }}'
          body: |
            Automated update from the official ZCode download page.

            Download: ${{ steps.release.outputs.url }}
            The package build workflow will verify the checksum and build the Arch package.
